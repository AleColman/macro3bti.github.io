<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="f2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5F0" />
      <stop offset="100%" stop-color="#F2EBE4" />
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#f2Grad)" />
  
  <!-- Kanban / Calendar Board -->
  <g transform="translate(80, 50)" filter="drop-shadow(0 8px 16px rgba(45,49,46,0.06))">
    <rect width="340" height="210" rx="14" fill="#FFFFFF" />
    
    <!-- Header of Board -->
    <rect width="340" height="42" rx="14" fill="#FBFBF9" />
    <circle cx="26" cy="21" r="5" fill="#E07A5F" />
    <circle cx="44" cy="21" r="5" fill="#F7D6C8" />
    <circle cx="62" cy="21" r="5" fill="#A8C3A0" />
    <text x="170" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#636B66" text-anchor="middle">Cronograma y Tareas (Sprint 3BTI)</text>
    
    <!-- Column 1: Por Hacer -->
    <g transform="translate(20, 56)">
      <rect width="90" height="135" rx="8" fill="#F8F9F6" />
      <text x="45" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#7B749E" text-anchor="middle">Planificado</text>
      <!-- Task 1 -->
      <rect x="8" y="32" width="74" height="42" rx="6" fill="#FFFFFF" stroke="#E6E8E2" />
      <rect x="14" y="42" width="40" height="5" rx="2.5" fill="#7B749E" />
      <rect x="14" y="52" width="60" height="4" rx="2" fill="#E6E8E2" />
      <rect x="14" y="60" width="30" height="6" rx="3" fill="#E8E5F2" />
    </g>
    
    <!-- Column 2: En Proceso -->
    <g transform="translate(125, 56)">
      <rect width="90" height="135" rx="8" fill="#F8F9F6" />
      <text x="45" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#E07A5F" text-anchor="middle">En Marcha</text>
      <!-- Task 2 -->
      <rect x="8" y="32" width="74" height="48" rx="6" fill="#FFFFFF" stroke="#F7D6C8" />
      <rect x="14" y="42" width="50" height="5" rx="2.5" fill="#E07A5F" />
      <rect x="14" y="52" width="60" height="4" rx="2" fill="#F7D6C8" />
      <rect x="14" y="62" width="45" height="8" rx="4" fill="#F3D2C1" />
    </g>
    
    <!-- Column 3: Completado -->
    <g transform="translate(230, 56)">
      <rect width="90" height="135" rx="8" fill="#F8F9F6" />
      <text x="45" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#5E8C6A" text-anchor="middle">Listo ✓</text>
      <!-- Task 3 -->
      <rect x="8" y="32" width="74" height="38" rx="6" fill="#FFFFFF" stroke="#A8C3A0" />
      <rect x="14" y="42" width="48" height="5" rx="2.5" fill="#5E8C6A" />
      <rect x="14" y="52" width="55" height="4" rx="2" fill="#A8C3A0" />
    </g>
  </g>
</svg>
