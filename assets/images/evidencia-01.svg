<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ev1g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FAF5" />
      <stop offset="100%" stop-color="#E8EFE5" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#ev1g)" />
  <g transform="translate(60, 50)">
    <!-- Main Report Card -->
    <rect width="480" height="300" rx="16" fill="#FFFFFF" stroke="#E6E8E2" stroke-width="2" filter="drop-shadow(0 12px 24px rgba(45,49,46,0.06))" />
    
    <!-- Top Bar -->
    <rect width="480" height="48" rx="16" fill="#FAFBF9" />
    <circle cx="28" cy="24" r="6" fill="#E07A5F" />
    <circle cx="46" cy="24" r="6" fill="#F7D6C8" />
    <circle cx="64" cy="24" r="6" fill="#88AF92" />
    <text x="240" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#3F6349" text-anchor="middle">REPORTE DE INVESTIGACIÓN · 3BTI</text>
    
    <!-- Left column: Survey statistics -->
    <g transform="translate(35, 75)">
      <rect width="200" height="185" rx="12" fill="#F8FAF6" />
      <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2C332D">Encuestas y Muestreo</text>
      <!-- Bars -->
      <rect x="20" y="55" width="160" height="8" rx="4" fill="#E8ECE4" />
      <rect x="20" y="55" width="135" height="8" rx="4" fill="#5E8C6A" />
      <text x="20" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#636B66">Requerimientos de usuario: 85%</text>
      
      <rect x="20" y="98" width="160" height="8" rx="4" fill="#E8ECE4" />
      <rect x="20" y="98" width="115" height="8" rx="4" fill="#E07A5F" />
      <text x="20" y="121" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#636B66">Factibilidad técnica: 72%</text>
      
      <rect x="20" y="141" width="160" height="8" rx="4" fill="#E8ECE4" />
      <rect x="20" y="141" width="150" height="8" rx="4" fill="#7B749E" />
      <text x="20" y="164" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#636B66">Interés de la comunidad: 94%</text>
    </g>
    
    <!-- Right column: Findings list -->
    <g transform="translate(255, 75)">
      <rect width="190" height="185" rx="12" fill="#FBFBF9" stroke="#E6E8E2" />
      <text x="18" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2C332D">Hallazgos Clave</text>
      
      <circle cx="28" cy="62" r="8" fill="#E8ECE4" />
      <path d="M25 62 L27 64 L31 60" stroke="#5E8C6A" stroke-width="2" fill="none"/>
      <rect x="44" y="59" width="125" height="7" rx="3.5" fill="#636B66" />
      
      <circle cx="28" cy="98" r="8" fill="#E8ECE4" />
      <path d="M25 98 L27 100 L31 96" stroke="#5E8C6A" stroke-width="2" fill="none"/>
      <rect x="44" y="95" width="115" height="7" rx="3.5" fill="#636B66" />
      
      <circle cx="28" cy="134" r="8" fill="#E8ECE4" />
      <path d="M25 134 L27 136 L31 132" stroke="#5E8C6A" stroke-width="2" fill="none"/>
      <rect x="44" y="131" width="130" height="7" rx="3.5" fill="#636B66" />
