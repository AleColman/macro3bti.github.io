      <circle cx="22" cy="50" r="7" fill="#5E8C6A" />
      <path d="M19 50 L21 52 L25 48" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <text x="35" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#2C332D">Código Fuente</text>
      
      <circle cx="22" cy="78" r="7" fill="#5E8C6A" />
