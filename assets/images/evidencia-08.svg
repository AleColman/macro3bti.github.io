    <!-- Top badge -->
    <rect width="480" height="42" rx="16" fill="#FBFBF9" />
    <text x="35" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#3F6349">RELEASE V1.0 · PAQUETE DE ENTREGA FINAL</text>
    
    <!-- Left product mockup representation -->
    <g transform="translate(35, 65)">
