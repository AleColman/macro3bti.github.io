    <rect x="250" y="27" width="25" height="8" rx="4" fill="#7B749E" />
    
    <!-- Hero block wireframe -->
    <rect x="25" y="55" width="130" height="14" rx="7" fill="#2C332D" />
    <rect x="25" y="78" width="140" height="6" rx="3" fill="#DCD7E9" />
    <rect x="25" y="90" width="110" height="6" rx="3" fill="#DCD7E9" />
    <rect x="25" y="110" width="55" height="20" rx="10" fill="#E07A5F" />
    
    <!-- Image placeholder card in wireframe -->
