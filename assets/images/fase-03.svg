      <circle cx="65" cy="16" r="10" fill="#5E8C6A" />
      <circle cx="95" cy="16" r="10" fill="#A8C3A0" />
      <circle cx="125" cy="16" r="10" fill="#F7D6C8" />
      <circle cx="155" cy="16" r="10" fill="#E07A5F" />
      <circle cx="185" cy="16" r="10" fill="#7B749E" />
