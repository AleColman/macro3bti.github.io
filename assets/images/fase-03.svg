      <stop offset="0%" stop-color="#F5F3F8" />
      <stop offset="100%" stop-color="#EBE7F2" />
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#f3Grad)" />
  
  <!-- Canvas wireframe artboard -->
