<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ev2g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F2F9" />
      <stop offset="100%" stop-color="#E8E3F2" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#ev2g)" />
  
  <g transform="translate(60, 50)">
    <!-- Canvas Frame -->
    <rect width="480" height="300" rx="16" fill="#FFFFFF" stroke="#E6E8E2" stroke-width="2" filter="drop-shadow(0 12px 24px rgba(123,116,158,0.1))" />
    
    <!-- Header of UI design tool -->
    <rect width="480" height="42" rx="16" fill="#FBFBF9" />
    <text x="30" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#7B749E">Figma · Prototipo Alta Fidelidad (3BTI)</text>
    
    <!-- Screen 1: Mobile Frame -->
    <g transform="translate(40, 65)">
      <rect width="115" height="205" rx="16" fill="#FAFAF7" stroke="#2C332D" stroke-width="2" />
      <rect x="35" y="10" width="45" height="4" rx="2" fill="#2C332D" />
      <!-- Content mock -->
      <rect x="15" y="30" width="85" height="10" rx="5" fill="#5E8C6A" />
      <rect x="15" y="48" width="60" height="6" rx="3" fill="#A8C3A0" />
      <rect x="15" y="65" width="85" height="50" rx="8" fill="#E8ECE4" />
      <rect x="15" y="125" width="85" height="30" rx="8" fill="#F7D6C8" />
      <rect x="15" y="165" width="85" height="24" rx="12" fill="#E07A5F" />
    </g>
    
    <!-- Screen 2: Desktop Frame -->
    <g transform="translate(180, 65)">
      <rect width="260" height="205" rx="12" fill="#FAFAF7" stroke="#E6E8E2" stroke-width="1.5" />
      <!-- Browser top -->
      <rect width="260" height="26" rx="12" fill="#F0F2EB" />
      <circle cx="15" cy="13" r="4" fill="#E07A5F" />
      <circle cx="28" cy="13" r="4" fill="#F7D6C8" />
      <circle cx="41" cy="13" r="4" fill="#88AF92" />
      <!-- Page body -->
      <rect x="20" y="42" width="120" height="12" rx="6" fill="#2C332D" />
      <rect x="20" y="62" width="130" height="6" rx="3" fill="#A8C3A0" />
      <rect x="20" y="78" width="80" height="18" rx="9" fill="#5E8C6A" />
      
      <!-- Right card in desktop -->
      <rect x="165" y="42" width="80" height="85" rx="10" fill="#E8E5F2" />
      <circle cx="205" cy="75" r="16" fill="#7B749E" />
      
      <!-- Bottom 3 cards -->
      <rect x="20" y="145" width="65" height="45" rx="8" fill="#FFFFFF" stroke="#E6E8E2" />
      <rect x="97" y="145" width="65" height="45" rx="8" fill="#FFFFFF" stroke="#E6E8E2" />
      <rect x="175" y="145" width="70" height="45" rx="8" fill="#FFFFFF" stroke="#E6E8E2" />
    </g>
  </g>
</svg>
