<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F5F0" />
      <stop offset="100%" stop-color="#E8ECE4" />
    </linearGradient>
    <linearGradient id="accentSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88AF92" />
      <stop offset="100%" stop-color="#5E8C6A" />
    </linearGradient>
    <linearGradient id="accentPeach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D6C8" />
      <stop offset="100%" stop-color="#E07A5F" />
    </linearGradient>
    <linearGradient id="accentLav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E5F2" />
      <stop offset="100%" stop-color="#7B749E" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2D332D" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background decorative organic blobs -->
  <path d="M480,120 C540,180 570,300 500,380 C430,460 300,470 190,430 C80,390 40,290 80,180 C120,70 250,50 360,70 C410,80 440,90 480,120 Z" fill="url(#bgGrad)" opacity="0.8"/>
  
  <!-- Back Card: Planning & Ideas -->
  <g transform="translate(60, 90)" filter="url(#softShadow)">
    <rect width="220" height="150" rx="16" fill="#FFFFFF" />
    <rect x="20" y="24" width="70" height="12" rx="6" fill="#DCD7E9" />
    <circle cx="185" cy="30" r="14" fill="#F7D6C8" />
    <path d="M185 24 L185 36 M179 30 L191 30" stroke="#E07A5F" stroke-width="2.5" stroke-linecap="round"/>
    
    <rect x="20" y="55" width="180" height="8" rx="4" fill="#F0F2EB" />
    <rect x="20" y="73" width="140" height="8" rx="4" fill="#F0F2EB" />
    
    <!-- Progress bar -->
    <rect x="20" y="105" width="180" height="10" rx="5" fill="#E8ECE4" />
    <rect x="20" y="105" width="125" height="10" rx="5" fill="url(#accentSage)" />
  </g>

  <!-- Central Card: Code & Architecture -->
  <g transform="translate(180, 160)" filter="url(#softShadow)">
    <rect width="280" height="200" rx="18" fill="#FFFFFF" />
    
    <!-- Window controls -->
    <rect x="0" y="0" width="280" height="42" rx="18" fill="#F8F9F6" />
    <circle cx="26" cy="21" r="5" fill="#F3D2C1" />
    <circle cx="44" cy="21" r="5" fill="#DCD7E9" />
    <circle cx="62" cy="21" r="5" fill="#A8C3A0" />
    <text x="140" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#7FA37A" text-anchor="middle">macroproyecto_3bti.js</text>
    
    <!-- Code lines representation -->
    <rect x="24" y="60" width="60" height="9" rx="4.5" fill="#7B749E" opacity="0.8" />
    <rect x="92" y="60" width="85" height="9" rx="4.5" fill="#5E8C6A" />
    
    <rect x="44" y="82" width="110" height="8" rx="4" fill="#A8C3A0" opacity="0.7" />
    <rect x="162" y="82" width="40" height="8" rx="4" fill="#E07A5F" opacity="0.8" />
    
    <rect x="44" y="102" width="80" height="8" rx="4" fill="#F3D2C1" />
    <rect x="132" y="102" width="95" height="8" rx="4" fill="#E8ECE4" />
    
    <rect x="44" y="122" width="130" height="8" rx="4" fill="#DCD7E9" />
    <rect x="24" y="146" width="45" height="9" rx="4.5" fill="#7B749E" opacity="0.8" />
    
    <!-- Mini badge inside -->
    <rect x="165" y="150" width="95" height="28" rx="14" fill="#F4F7F2" stroke="#A8C3A0" stroke-width="1.5"/>
    <text x="212" y="168" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#3F6349" text-anchor="middle">3.º BTI ✓</text>
  </g>

  <!-- Front Floating Badge: Team & Collaboration -->
  <g transform="translate(100, 310)" filter="url(#softShadow)">
    <rect width="190" height="74" rx="16" fill="#FFFFFF" />
    <circle cx="42" cy="37" r="19" fill="#F7D6C8" />
    <!-- User icon -->
    <circle cx="42" cy="32" r="7" fill="#E07A5F" />
    <path d="M30 45 C30 40 35 38 42 38 C49 38 54 40 54 45 Z" fill="#E07A5F" />
    
    <text x="74" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C332D">Trabajo en Equipo</text>
    <text x="74" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#636B66">Metodología colaborativa</text>
  </g>

  <!-- Floating Sparkles and Soft Tech Icons -->
  <g transform="translate(480, 110)">
    <circle cx="20" cy="20" r="24" fill="#FFFFFF" filter="url(#softShadow)" />
    <path d="M20 10 L23 17 L30 20 L23 23 L20 30 L17 23 L10 20 L17 17 Z" fill="#E07A5F" />
  </g>

  <g transform="translate(470, 310)">
    <circle cx="22" cy="22" r="26" fill="#FFFFFF" filter="url(#softShadow)" />
    <!-- Graduation Cap / Learning icon -->
    <path d="M12 20 L22 15 L32 20 L22 25 Z" fill="#5E8C6A" />
    <path d="M16 23 L16 28 C16 31 22 33 22 33 C22 33 28 31 28 28 L28 23" stroke="#5E8C6A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M30 21 L34 26" stroke="#5E8C6A" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Connecting curved dotted line -->
  <path d="M170 160 C180 80 430 80 460 140" stroke="#A8C3A0" stroke-width="2.5" stroke-dasharray="6 6" fill="none" opacity="0.6"/>
</svg>
