    <!-- Code content -->
    <g transform="translate(30, 65)" font-family="'Consolas', monospace" font-size="13">
      <text x="0" y="20" fill="#7B749E">// Renderizado dinámico de evidencias y filtros</text>
      <text x="0" y="45" fill="#7B749E">function</text>
      <text x="70" y="45" fill="#88AF92">aplicarFiltro</text>
      <text x="175" y="45" fill="#FAFAF7">(categoria) {</text>
      
      <text x="25" y="70" fill="#7B749E">const</text>
      <text x="75" y="70" fill="#F7D6C8">items</text>
      <text x="125" y="70" fill="#FAFAF7">=</text>
      <text x="140" y="70" fill="#F7D6C8">evidencias</text>
      <text x="220" y="70" fill="#FAFAF7">.filter(item =&gt;</text>
      
      <text x="45" y="95" fill="#F7D6C8">categoria</text>
      <text x="125" y="95" fill="#FAFAF7">===</text>
      <text x="155" y="95" fill="#E07A5F">'todos'</text>
      <text x="220" y="95" fill="#FAFAF7">|| item.</text>
      <text x="285" y="95" fill="#88AF92">cat</text>
      <text x="315" y="95" fill="#FAFAF7">===</text>
      <text x="345" y="95" fill="#F7D6C8">categoria</text>
      
      <text x="25" y="120" fill="#FAFAF7">);</text>
      <text x="25" y="145" fill="#88AF92">renderizarTarjetas</text>
      <text x="165" y="145" fill="#FAFAF7">(items);</text>
      <text x="0" y="170" fill="#FAFAF7">}</text>
