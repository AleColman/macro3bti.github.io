<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ev3g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE" />
      <stop offset="100%" stop-color="#F2EAE0" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#ev3g)" />
  
  <g transform="translate(60, 50)">
    <!-- Whiteboard -->
    <rect width="480" height="300" rx="16" fill="#FFFFFF" stroke="#E6E8E2" stroke-width="2" filter="drop-shadow(0 12px 24px rgba(45,49,46,0.06))" />
    
    <text x="35" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#2C332D">Mesa de Trabajo · Dinámica Ágil y Roles</text>
    <rect x="35" y="52" width="410" height="2" fill="#F0F2EB" />
    
    <!-- Post-it notes grid -->
    <!-- Note 1 Sage -->
    <g transform="translate(35, 75)">
      <rect width="120" height="95" rx="8" fill="#EBF4EE" stroke="#A8C3A0" stroke-width="1.5" />
      <rect x="15" y="15" width="50" height="6" rx="3" fill="#5E8C6A" />
      <rect x="15" y="30" width="85" height="5" rx="2.5" fill="#A8C3A0" />
      <rect x="15" y="42" width="70" height="5" rx="2.5" fill="#A8C3A0" />
      <text x="15" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#3F6349">Arquitectura</text>
    </g>
    
    <!-- Note 2 Peach -->
    <g transform="translate(180, 75)">
      <rect width="120" height="95" rx="8" fill="#FDF3EE" stroke="#F7D6C8" stroke-width="1.5" />
      <rect x="15" y="15" width="50" height="6" rx="3" fill="#E07A5F" />
      <rect x="15" y="30" width="85" height="5" rx="2.5" fill="#F7D6C8" />
      <rect x="15" y="42" width="70" height="5" rx="2.5" fill="#F7D6C8" />
      <text x="15" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#E07A5F">Historias Usuario</text>
    </g>
    
    <!-- Note 3 Lavender -->
    <g transform="translate(325, 75)">
      <rect width="120" height="95" rx="8" fill="#F4F2F9" stroke="#DCD7E9" stroke-width="1.5" />
      <rect x="15" y="15" width="50" height="6" rx="3" fill="#7B749E" />
      <rect x="15" y="30" width="85" height="5" rx="2.5" fill="#DCD7E9" />
      <rect x="15" y="42" width="70" height="5" rx="2.5" fill="#DCD7E9" />
      <text x="15" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#7B749E">Validaciones</text>
    </g>
    
    <!-- Avatars meeting row at bottom -->
    <g transform="translate(35, 200)">
      <rect width="410" height="70" rx="12" fill="#F8FAF6" />
      <!-- Avatar 1 -->
      <circle cx="45" cy="35" r="20" fill="#EBF4EE" stroke="#5E8C6A" stroke-width="2"/>
      <circle cx="45" cy="30" r="8" fill="#5E8C6A" />
      <!-- Avatar 2 -->
      <circle cx="105" cy="35" r="20" fill="#FDF3EE" stroke="#E07A5F" stroke-width="2"/>
      <circle cx="105" cy="30" r="8" fill="#E07A5F" />
      <!-- Avatar 3 -->
      <circle cx="165" cy="35" r="20" fill="#F4F2F9" stroke="#7B749E" stroke-width="2"/>
      <circle cx="165" cy="30" r="8" fill="#7B749E" />
      
      <text x="215" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2C332D">Coordinación en Grupo</text>
      <text x="215" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#636B66">Distribución equitativa y retroalimentación</text>
    </g>
  </g>
</svg>
