<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="f1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F6F2" />
      <stop offset="100%" stop-color="#E5ECE2" />
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#f1Grad)" />
  
  <!-- Central Document / Research Binder -->
  <g transform="translate(140, 45)">
    <!-- Binder back -->
    <rect x="15" y="10" width="190" height="210" rx="12" fill="#E8E5F2" />
    <!-- White paper sheet -->
    <rect x="25" y="20" width="170" height="190" rx="8" fill="#FFFFFF" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.04))" />
    
    <!-- Paper content lines -->
    <rect x="45" y="45" width="80" height="10" rx="5" fill="#7B749E" />
    <rect x="45" y="68" width="130" height="6" rx="3" fill="#DCD7E9" />
    <rect x="45" y="82" width="120" height="6" rx="3" fill="#DCD7E9" />
    <rect x="45" y="96" width="100" height="6" rx="3" fill="#DCD7E9" />
    
    <rect x="45" y="118" width="130" height="6" rx="3" fill="#A8C3A0" />
    <rect x="45" y="132" width="115" height="6" rx="3" fill="#E8ECE4" />
    <rect x="45" y="146" width="125" height="6" rx="3" fill="#E8ECE4" />
    
    <!-- Tag sticker -->
    <rect x="45" y="165" width="65" height="22" rx="11" fill="#F7D6C8" />
    <text x="77" y="179" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#E07A5F" text-anchor="middle">FASE 01</text>
  </g>
  
  <!-- Magnifying glass / Inspection -->
  <g transform="translate(250, 120)">
    <circle cx="55" cy="55" r="38" fill="#FFFFFF" stroke="#5E8C6A" stroke-width="6" filter="drop-shadow(0 8px 16px rgba(94,140,106,0.2))" />
    <line x1="82" y1="82" x2="115" y2="115" stroke="#3F6349" stroke-width="10" stroke-linecap="round" />
    <!-- Glass reflection -->
    <path d="M35 40 A 25 25 0 0 1 70 30" stroke="#A8C3A0" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M45 55 L52 62 L66 48" stroke="#5E8C6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Floating topic pills -->
  <g transform="translate(50, 80)">
    <rect width="105" height="32" rx="16" fill="#FFFFFF" stroke="#E6E8E2" />
    <text x="52" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#5E8C6A" text-anchor="middle">Recolección</text>
  </g>
  <g transform="translate(340, 50)">
    <rect width="110" height="32" rx="16" fill="#FFFFFF" stroke="#E6E8E2" />
    <text x="55" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#7B749E" text-anchor="middle">Análisis Datos</text>
  </g>
</svg>
